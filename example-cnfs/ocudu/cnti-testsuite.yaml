---
# CNTi Test Suite configuration for the OCUDU gNB (open CU/DU by SRS):
# the upstream ocudu-gnb Helm chart from the OCUDU OCI registry, run in
# gNB test mode (ru_dummy + test_mode.test_ue, no core, no RU) so the whole
# stack except the fronthaul is exercised on a plain Kubernetes cluster.
config_version: "v2"
common:
  container_names:
    - name: ocudu-gnb
      # A second, retained image tag of the same repository for the rolling
      # update / downgrade / version change / rollback tests. The tests only
      # need it to differ from the installed tag; it happens to be older, so
      # the "update" moves back.
      rolling_update_test_tag: "ubuntu-24.04-avx2-20260930_cb9ca3f2-stable"
      rolling_downgrade_test_tag: "ubuntu-24.04-avx2-20260930_cb9ca3f2-stable"
      rolling_version_change_test_tag: "ubuntu-24.04-avx2-20260930_cb9ca3f2-stable"
      rollback_from_tag: "ubuntu-24.04-avx2-20260930_cb9ca3f2-stable"
deployments:
  helm_charts:
    - name: ocudu-gnb
      registry_url: "oci://registry.gitlab.com/ocudu/ocudu_elements/ocudu_helm/ocudu-gnb"
      chart_version: "3.12.3"
      helm_values: -f ./example-cnfs/ocudu/gnb-values.yaml
