# CNF projects that run the essential tests in their own CI, with
# lfn-cnti/testsuite-action on GitHub or the lfn-cnti/testsuite-component on
# GitLab, and show the result as a README badge. The adopter canary
# (workflows/adopter_canary.yml) runs a suite built from this repository
# against each of them and compares the result, test by test, with the
# adopter's own last run (#2727).
#
# Each entry mirrors the adopter's job, so the canary runs what their badge
# runs. Their files (the suite configuration, the kind config) are read from
# their repository, at the commit of their last run; only what their job does
# around the action or the component is repeated here. When an adopter
# changes its job, update its entry.
#
#   name             job name and artifact suffix: lower case, no spaces
#   display_name     how the CNF is called in the report
#   host             github (default) or gitlab (gitlab.com)
#   repo             owner/name on GitHub, or the project path on gitlab.com
#   workflow         GitHub: file name of their workflow; its runs on the
#                    default branch are the baseline. GitLab: name of their
#                    job (the component's is cnti-testsuite); its runs in
#                    pipelines of the default branch, child pipelines
#                    included, are the baseline
#   artifact         GitHub: name of the results artifact (the action's
#                    artifact_name). GitLab: unused, the job's artifacts
#   cnf_config       path of their cnti-testsuite.yaml in their repository
#   kind_config      path of their kind config; empty for the action's
#                    default (a control plane and two workers)
#   install_timeout  seconds for cnf_install; empty for the suite's default
#   tests            what they run (the action's tests input)
#   env              environment their job sets
#   runner           GitHub runner image for the canary job; empty for
#                    ubuntu-24.04
#   prepare          commands their job runs before the action, in their
#                    checkout
#   expected         changes from the adopter's own result that a suite change
#                    makes on purpose: test, from, to (a status, or "-" when the
#                    test is missing from one run) and reason. Any other change
#                    fails the canary. Add an entry in the pull request that
#                    makes the change; remove it once the adopter's own runs
#                    show the new result (the canary reports such entries).
adopters:
  - name: jitsi
    display_name: Jitsi Meet
    host: github
    repo: jitsi-contrib/jitsi-helm
    workflow: cnti.yml
    artifact: cnti-testsuite-results
    cnf_config: .github/cnti/cnti-testsuite.yaml
    kind_config: ""
    install_timeout: ""
    tests: cert
    env: {}
    prepare: ""
    expected: []

  - name: sdcore
    display_name: Aether SD-Core
    host: github
    repo: omec-project/sdcore-helm-charts
    workflow: cnti.yml
    artifact: cnti-testsuite-results
    cnf_config: .github/cnti/cnti-testsuite.yaml
    kind_config: .github/cnti/kind.yaml
    install_timeout: "900"
    tests: cert
    env:
      CNTI_TESTSUITE_GENERIC_OPERATION_TIMEOUT: "180"
    prepare: |
      helm repo add bitnami https://charts.bitnami.com/bitnami
      helm dependency build 5g-control-plane
      helm dependency build sdcore-helm-charts
    expected: []

  # The job runs in the ocudu-gnb chart's child pipeline, on merge requests
  # and on main when the chart or its test values change; the artifacts of a
  # run on main are kept for 30 days. After a month without a chart change
  # the canary runs on OCUDU's main without a comparison. It is the nightly
  # essential-tests run against OCUDU (ocudu_validation.yml runs the workload
  # suite only).
  - name: ocudu
    display_name: OCUDU gNB
    host: gitlab
    repo: ocudu/ocudu_elements/ocudu_helm
    workflow: cnti-testsuite
    artifact: ""
    cnf_config: .gitlab/cnti/ocudu-gnb/cnti-testsuite.yaml
    kind_config: ""
    install_timeout: "900"
    tests: cert
    env: {}
    prepare: ""
    expected: []

  # free5GC's badge job runs nightly and on pushes to main that change the
  # chart or the job, so a recent baseline is always there. Like their job,
  # the canary builds and loads the gtp5g kernel module on the runner first:
  # kind nodes share the host kernel, and the UPF forwards through it. It is
  # the nightly essential-tests run against free5GC (free5gc_validation.yml
  # runs the workload suite and the long chaos tests only).
  - name: free5gc
    display_name: free5GC
    host: github
    repo: free5gc/free5gc-helm
    workflow: cnti.yml
    artifact: cnti-testsuite-results
    cnf_config: cnti-testsuite.yaml
    kind_config: ci/kind-cnti.yaml
    install_timeout: "1800"
    tests: cert
    env:
      CNTI_TESTSUITE_GENERIC_OPERATION_TIMEOUT: "180"
    # gtp5g v0.10.2 is the newest release free5GC v4.3.0's UPF accepts
    # (free5gc/free5gc#1212, fixed in go-upf #109, not yet in an image), and it
    # does not build against the kernel 7.0 headers of the ubuntu-24.04 image;
    # ubuntu-22.04 (kernel 6.8) builds it. free5GC's own job moved to
    # self-hosted runners with the module preinstalled (free5gc-helm#41).
    runner: ubuntu-22.04
    prepare: |
      sudo apt-get update -qq
      sudo apt-get install -y -qq build-essential "linux-headers-$(uname -r)"
      git clone --depth 1 --branch v0.10.2 https://github.com/free5gc/gtp5g.git /tmp/gtp5g
      make -C /tmp/gtp5g -j"$(nproc)"
      sudo make -C /tmp/gtp5g install
      sudo modprobe gtp5g
      lsmod | grep -q '^gtp5g'
    expected:
      - test: node_drain
        from: failed
        to: passed
        reason: "their self-hosted runner (free5gc-helm#41) recovers the evicted workloads slowly (NRF Ready after 258 s, the AMF waits for it) and the 180 s readiness window is missed there; the same chart passes on a GitHub-hosted runner, not a suite change"

  # eUPF's badge job runs nightly. Its kind config mounts the host's bpffs into
  # every node: eUPF runs as a non-root user and can't mount it itself.
  - name: eupf
    display_name: eUPF
    host: github
    repo: edgecomllc/eupf
    workflow: cnti.yml
    artifact: cnti-testsuite-results
    cnf_config: .github/cnti/cnti-testsuite.yaml
    kind_config: .github/cnti/kind.yaml
    install_timeout: ""
    tests: cert
    env: {}
    prepare: ""
    expected: []
