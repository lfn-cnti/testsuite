name: free5GC validation

on:
  schedule:
    # Midnight; the OCUDU validation runs on the same runner pool once this
    # one has had time to finish (workload about 4.7 h).
    - cron: '0 0 * * *'
  workflow_dispatch:

# Each job owns a whole kind cluster on the shared self-hosted runners, so runs
# must not overlap. Queue them instead of cancelling: a nightly run that is
# already exercising free5GC is worth finishing.
concurrency:
  group: free5gc-validation
  cancel-in-progress: false

jobs:
  free5gc:
    uses: ./.github/workflows/example_cnf_validation.yml
    with:
      cnf: free5gc
      display_name: free5GC
      # In one job the workload suite would take about four and a quarter
      # hours on a hosted runner, with little room under the six a hosted job
      # may run. Three chaos tests run in a job of their own (see
      # spec/free5gc_spec.cr): about three hours and an hour and a half.
      # 360 is the hosted cut-off.
      timeout_minutes: 360
      # The essential tests run against free5GC every night in the adopter
      # canary (adopter_canary.yml), on free5GC's own chart and configuration
      # and compared with their badge; here only the workload suite and the
      # long chaos tests run, which the canary does not. free5gc_cert stays in
      # spec/free5gc_spec.cr for a run by hand.
      suites: '["workload", "long_chaos"]'
      gtp5g: true
    secrets: inherit
