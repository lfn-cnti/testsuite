name: free5GC validation

on:
  schedule:
    # Midnight; the OCUDU validation runs on the same runner pool once this
    # one has had time to finish (cert about 1.5 h, workload about 4.7 h).
    - cron: '0 0 * * *'
  workflow_dispatch:

# Each job owns a whole kind cluster on the shared self-hosted runners, so runs
# must not overlap. Queue them instead of cancelling: a nightly run that is
# already exercising free5GC is worth finishing.
concurrency:
  group: free5gc-validation
  cancel-in-progress: false

jobs:
  free5gc:
    uses: ./.github/workflows/example_cnf_validation.yml
    with:
      cnf: free5gc
      display_name: free5GC
      # The workload run took under five hours on the self-hosted runners and
      # a hosted runner is faster; 360 is also the hosted job cut-off.
      timeout_minutes: 360
      gtp5g: true
    secrets: inherit
