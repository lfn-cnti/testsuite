name: OCUDU validation

on:
  schedule:
    # After the free5GC validation, which starts at midnight on the same
    # runner pool and takes about six hours end to end.
    - cron: '0 7 * * *'
  workflow_dispatch:

# Each job owns a whole kind cluster on the shared self-hosted runners, so runs
# must not overlap. Queue them instead of cancelling.
concurrency:
  group: ocudu-validation
  cancel-in-progress: false

jobs:
  ocudu:
    uses: ./.github/workflows/example_cnf_validation.yml
    with:
      cnf: ocudu
      display_name: OCUDU
      # The cert leg takes about 10 minutes and the workload leg about 30.
      timeout_minutes: 90
    secrets: inherit
