name: free5GC workload validation
on:
  push:
    branches:
      - '**'
  workflow_dispatch:

# The validation owns a whole kind cluster on a shared self-hosted runner, so
# runs of this workflow must not overlap. A newer push on the same branch
# cancels the older run.
concurrency:
  group: free5gc-workload-${{ github.ref }}
  cancel-in-progress: true

jobs:
  free5gc-workload-validation:
    runs-on: [v1.0.0]
    # A full workload run installs several heavy CNFs and can exceed the default
    # 360-minute job timeout, so give it twice that.
    timeout-minutes: 720
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
      # Unique per run, like the nightly: a fixed name collides with a leaked
      # cluster from a previous run.
      KIND_CLUSTER_NAME: free5gc-workload-${{ github.run_id }}
    steps:
      - name: Checkout Code & Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Login to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_PASSWORD != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_PASSWORD }}
      - name: Install kind
        uses: ./.github/actions/install-kind
      - name: Setup Kind Cluster with Sysctl Patch
        run: |
          cat <<EOF > kind_setup.yaml
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          containerdConfigPatches:
          - |-
            root = "/tmp/containerd"
          nodes:
          - role: control-plane
            kubeadmConfigPatches:
            - |
              kind: KubeletConfiguration
              allowedUnsafeSysctls:
                - "net.ipv4.ip_forward"
                - "net.ipv4.conf.all.forwarding"
            - |
              kind: ClusterConfiguration
              etcd:
                local:
                  dataDir: /tmp/etcd
            extraMounts:
            - containerPath: /var/lib/kubelet/config.json
              hostPath: $HOME/.docker/config.json
          - role: worker
            kubeadmConfigPatches:
            - |
              kind: KubeletConfiguration
              allowedUnsafeSysctls:
                - "net.ipv4.ip_forward"
                - "net.ipv4.conf.all.forwarding"
            extraMounts:
            - containerPath: /var/lib/kubelet/config.json
              hostPath: $HOME/.docker/config.json
          - role: worker
            kubeadmConfigPatches:
            - |
              kind: KubeletConfiguration
              allowedUnsafeSysctls:
                - "net.ipv4.ip_forward"
                - "net.ipv4.conf.all.forwarding"
            extraMounts:
            - containerPath: /var/lib/kubelet/config.json
              hostPath: $HOME/.docker/config.json
          EOF
          kind create cluster --name "$KIND_CLUSTER_NAME" --config kind_setup.yaml --wait 5m
      - name: Build CNTi Test Suite
        run: |
          shards install
          crystal build src/cnti-testsuite.cr
      - name: Run Free5GC Workload Test
        run: |
          CNTI_TESTSUITE_LOG_LEVEL=INFO crystal spec --tag free5gc_workload -v
      - name: Delete Kind Cluster
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        run: |
          until kind delete cluster --name "$KIND_CLUSTER_NAME" --verbosity 1; do sleep 1; done
