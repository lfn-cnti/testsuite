name: Test documentation lint
on:
  push:
    paths:
        - 'docs/*'
        - 'doc-lint/*'
  pull_request:
    paths:
        - 'docs/*'
        - 'doc-lint/*'
jobs:
  lint-docs:
    name: Lint Docs
    runs-on: ubuntu-24.04
    container:
       image: ruby:3.4
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Install mdl
      run: gem install mdl
    - name: Run mdl
      run: mdl -s doc-lint/mdl-style.rb -u doc-lint/mdl-TTDS-rules.rb docs/TEST_DOCUMENTATION.md