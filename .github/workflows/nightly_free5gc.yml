name: free5GC validation
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

# The validation owns a whole kind cluster on a shared self-hosted runner, so
# runs must not overlap. Queue them instead of cancelling: a nightly run that
# is already exercising free5GC is worth finishing.
concurrency:
  group: free5gc-validation
  cancel-in-progress: false

jobs:
  free5gc-validation:
    runs-on: [v1.0.0]
    env:
      # Unique per run. A fixed name ("free5gc-dev") collided whenever a second
      # run started before the first had cleaned up, and a leaked cluster then
      # blocked every later run: "node(s) already exist for a cluster with the
      # name free5gc-dev".
      KIND_CLUSTER_NAME: free5gc-${{ github.run_id }}
    steps:
      - name: Checkout Code & Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive 
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Install kind
        uses: ./.github/actions/install-kind
      - name: Setup Kind Cluster with Sysctl Patch
        run: |
          cat <<EOF > kind_setup.yaml
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          containerdConfigPatches:
          - |-
            root = "/tmp/containerd"
          nodes:
          - role: control-plane
            kubeadmConfigPatches:
            - |
              kind: KubeletConfiguration
              allowedUnsafeSysctls:
                - "net.ipv4.ip_forward"
                - "net.ipv4.conf.all.forwarding"
            - |
              kind: ClusterConfiguration
              etcd:
                local:
                  dataDir: /tmp/etcd
            extraMounts:
            - containerPath: /var/lib/kubelet/config.json
              hostPath: $HOME/.docker/config.json
          - role: worker
            kubeadmConfigPatches:
            - |
              kind: KubeletConfiguration
              allowedUnsafeSysctls:
                - "net.ipv4.ip_forward"
                - "net.ipv4.conf.all.forwarding"
            extraMounts:
            - containerPath: /var/lib/kubelet/config.json
              hostPath: $HOME/.docker/config.json
          - role: worker
            kubeadmConfigPatches:
            - |
              kind: KubeletConfiguration
              allowedUnsafeSysctls:
                - "net.ipv4.ip_forward"
                - "net.ipv4.conf.all.forwarding"
            extraMounts:
            - containerPath: /var/lib/kubelet/config.json
              hostPath: $HOME/.docker/config.json
          EOF
          kind create cluster --name "$KIND_CLUSTER_NAME" --config kind_setup.yaml --wait 5m
      - name: Build CNTi Test Suite
        run: |
          shards install
          crystal build src/cnti-testsuite.cr
      - name: Run Free5GC Spec Test
        run: |
          CNTI_TESTSUITE_LOG_LEVEL=INFO crystal spec spec/free5gc_cert_spec.cr -v
      - name: Delete Kind Cluster
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        run: |
          until kind delete cluster --name "$KIND_CLUSTER_NAME" --verbosity 1; do sleep 1; done
