name: airgap
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: airgap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  airgap:
    name: Air-gapped run
    # The iptables rules below are host-wide. On a shared/self-hosted runner
    # they can cut off another kind cluster that uses the same Docker network
    # and pod CIDR, so this job needs the isolated VM of a GitHub-hosted runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      KIND_CLUSTER_NAME: airgap-${{ github.run_id }}
    steps:
      - name: Set runner paths
        run: |
          echo "KUBECONFIG=$RUNNER_TEMP/airgap-kubeconfig" >> "$GITHUB_ENV"
          echo "CNTI_TESTSUITE_OFFLINE_DIR=$RUNNER_TEMP/airgap-bundle" >> "$GITHUB_ENV"
      - name: Checkout Code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install the CNTi toolchain
        uses: ./.github/actions/install-cnti-toolchain
      - name: Install kind
        uses: ./.github/actions/install-kind
      - name: Build CNTi Test Suite
        run: |
          shards install
          crystal build src/cnti-testsuite.cr
      - name: Prepare the CNF chart for a local install
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/airgap-cnf"
          helm pull coredns --repo https://cncf.gitlab.io/stable --version 1.13.8 \
            --untar --untardir "$RUNNER_TEMP/airgap-cnf"
          cat > "$RUNNER_TEMP/airgap-cnf/cnti-testsuite.yaml" <<'EOF'
          ---
          config_version: v2
          common:
            container_names:
            - name: coredns
              rollback_from_tag: 1.8.0
              rolling_update_test_tag: 1.8.0
              rolling_downgrade_test_tag: 1.6.7
              rolling_version_change_test_tag: 1.8.0
          deployments:
            helm_dirs:
            - name: coredns
              helm_directory: coredns
          EOF
      - name: Prepare the offline bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ./cnti-testsuite airgap_prepare \
            --cnf-config "$RUNNER_TEMP/airgap-cnf/cnti-testsuite.yaml"
          # The coredns chart's image is a template, so airgap_prepare cannot
          # read it; render the chart and add what the compatibility tests use.
          helm template coredns "$RUNNER_TEMP/airgap-cnf/coredns" \
            | awk '$1 == "image:" { gsub(/"/, "", $2); print $2 }' \
            >> "$CNTI_TESTSUITE_OFFLINE_DIR/images.txt"
          printf 'coredns/coredns:1.6.7\ncoredns/coredns:1.8.0\nbusybox:1.36\n' \
            >> "$CNTI_TESTSUITE_OFFLINE_DIR/images.txt"
          sort -u -o "$CNTI_TESTSUITE_OFFLINE_DIR/images.txt" \
            "$CNTI_TESTSUITE_OFFLINE_DIR/images.txt"
          cat "$CNTI_TESTSUITE_OFFLINE_DIR/images.txt"
          ./cnti-testsuite airgap_status
      - name: Write the kind cluster config
        run: |
          cat > "$RUNNER_TEMP/airgap-cluster.yml" <<'EOF'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
          - role: control-plane
            kubeadmConfigPatches:
            - |
              kind: ClusterConfiguration
              etcd:
                local:
                  dataDir: /tmp/etcd
          - role: worker
          - role: worker
          EOF
      - name: Create the kind cluster
        uses: ./.github/actions/create-kind-cluster
        with:
          name: ${{ env.KIND_CLUSTER_NAME }}
          config: ${{ runner.temp }}/airgap-cluster.yml
          kubeconfig: ${{ runner.temp }}/airgap-kubeconfig
      - name: Check for Docker Hub credentials
        id: dockerhub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Login to Docker Hub
        if: steps.dockerhub.outputs.available == 'true'
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Load the bundle images into kind
        run: |
          set -euo pipefail
          while IFS= read -r image; do
            [ -z "$image" ] && continue
            echo "Loading $image"
            docker pull "$image"
            kind load docker-image "$image" --name "$KIND_CLUSTER_NAME"
          done < "$CNTI_TESTSUITE_OFFLINE_DIR/images.txt"
      - name: Logout of Docker Hub
        if: always() && steps.dockerhub.outputs.available == 'true'
        run: docker logout
      - name: Cut the kind network off from the internet
        run: |
          set -euo pipefail
          # Docker can list the IPv6 subnet first: iptables rejects it with
          # "invalid mask '64'", and the IPv4 side would stay open. Block
          # every address family the network has with its own table.
          KIND_SUBNETS=$(docker network inspect kind \
            -f '{{range .IPAM.Config}}{{println .Subnet}}{{end}}' | tr '\n' ' ')
          KIND_SUBNETS=${KIND_SUBNETS% }
          if [ -z "$KIND_SUBNETS" ]; then
            echo "::error::the kind network has no subnet to block"
            exit 1
          fi
          echo "KIND_SUBNETS=$KIND_SUBNETS" >> "$GITHUB_ENV"
          # Reject first, then prepend the cluster destinations that stay
          # reachable. Each rule has one -d: iptables rejects several.
          IPV4_KIND_SUBNETS=()
          for subnet in $KIND_SUBNETS; do
            case "$subnet" in
              *:*)
                tables=ip6tables
                ;;
              *)
                tables=iptables
                IPV4_KIND_SUBNETS+=("$subnet")
                ;;
            esac
            echo "Blocking new connections from $subnet outside the kind network"
            sudo "$tables" -I DOCKER-USER -s "$subnet" \
              -m conntrack --ctstate NEW -j REJECT
          done
          # Pod traffic leaves the node SNATed to the kind network; the IPv4
          # pod range is covered too for a CNI that does not SNAT.
          if [ "${#IPV4_KIND_SUBNETS[@]}" -gt 0 ]; then
            sudo iptables -I DOCKER-USER -s 10.244.0.0/16 \
              -m conntrack --ctstate NEW -j REJECT
          fi
          for destination in 10.96.0.0/16 10.244.0.0/16; do
            sudo iptables -I DOCKER-USER -d "$destination" -j ACCEPT
          done
          for subnet in $KIND_SUBNETS; do
            case "$subnet" in
              *:*) sudo ip6tables -I DOCKER-USER -d "$subnet" -j ACCEPT ;;
              *) sudo iptables -I DOCKER-USER -d "$subnet" -j ACCEPT ;;
            esac
          done
      - name: Verify the cluster cannot reach the internet
        run: |
          set -euo pipefail
          kubectl run airgap-check --image=busybox:1.36 --restart=Never \
            --command -- sleep 300
          kubectl wait --for=condition=Ready pod/airgap-check --timeout=120s
          if kubectl exec airgap-check -- sh -c 'nc -w 5 1.1.1.1 443 </dev/null'; then
            echo "::error::a pod reached 1.1.1.1:443; the kind network is not air-gapped"
            exit 1
          fi
          echo "No route to 1.1.1.1:443 from a pod"
          kubectl delete pod airgap-check --wait=false
      - name: Run cert and workload in offline mode
        env:
          CNTI_TESTSUITE_OFFLINE: "1"
        run: |
          set -euo pipefail
          # The suite runs on the runner, not only in the cluster. Block its
          # process group from reaching anything but loopback, while leaving
          # the Actions runner's own connections alone: the kind API is on
          # 127.0.0.1, and every host fetch must come from the bundle.
          SUITE_GROUP=airgap-suite
          sudo groupadd -f "$SUITE_GROUP"
          SUITE_GID=$(getent group "$SUITE_GROUP" | cut -d: -f3)
          SUITE_UID=$(id -u)
          if ! command -v setpriv >/dev/null 2>&1; then
            echo "::error::setpriv is required to run the suite with the airgap group"
            exit 1
          fi
          HOST_TABLES=(iptables)
          if command -v ip6tables >/dev/null 2>&1; then
            HOST_TABLES+=(ip6tables)
          fi
          HOST_RULES_ADDED=0
          remove_host_egress_block() {
            if [ "$HOST_RULES_ADDED" = 1 ]; then
              for tables in "${HOST_TABLES[@]}"; do
                sudo "$tables" -D OUTPUT -m owner --gid-owner "$SUITE_GID" -o lo -j ACCEPT || true
                sudo "$tables" -D OUTPUT -m owner --gid-owner "$SUITE_GID" \
                  -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT || true
                sudo "$tables" -D OUTPUT -m owner --gid-owner "$SUITE_GID" -j REJECT || true
              done
            fi
          }
          trap remove_host_egress_block EXIT
          HOST_RULES_ADDED=1
          for tables in "${HOST_TABLES[@]}"; do
            sudo "$tables" -I OUTPUT 1 -m owner --gid-owner "$SUITE_GID" -j REJECT
            sudo "$tables" -I OUTPUT 1 -m owner --gid-owner "$SUITE_GID" \
              -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
            sudo "$tables" -I OUTPUT 1 -m owner --gid-owner "$SUITE_GID" -o lo -j ACCEPT
          done
          run_offline() {
            sudo --preserve-env=PATH,HOME,KUBECONFIG,CNTI_TESTSUITE_OFFLINE,CNTI_TESTSUITE_OFFLINE_DIR \
              setpriv --reuid "$SUITE_UID" --regid "$SUITE_GID" --clear-groups -- "$@"
          }
          run_offline true
          if run_offline timeout 5 bash -c 'cat < /dev/null > /dev/tcp/1.1.1.1/443'; then
            echo "::error::the suite process reached 1.1.1.1:443; host-side egress is not blocked"
            exit 1
          fi
          echo "No route to 1.1.1.1:443 from the suite process"
          run_offline ./cnti-testsuite setup
          run_offline ./cnti-testsuite cnf_install \
            --cnf-config "$RUNNER_TEMP/airgap-cnf/cnti-testsuite.yaml"
          set +e
          run_offline ./cnti-testsuite cert 2>&1 | tee airgap-cert.log
          cert_status=${PIPESTATUS[0]}
          run_offline ./cnti-testsuite workload 2>&1 | tee airgap-workload.log
          workload_status=${PIPESTATUS[0]}
          set -e
          run_offline ./cnti-testsuite cnf_uninstall || true
          run_offline ./cnti-testsuite uninstall_all || true
          failed=0
          if [ "$cert_status" -ne 0 ]; then
            echo "::error::cert exited $cert_status in offline mode"
            failed=1
          fi
          if ! grep -q '^Cert: PASSED ' airgap-cert.log; then
            echo "::error::cert did not report PASSED in offline mode"
            failed=1
          fi
          # `workload` exits 0 when every test passed and 1 when some failed;
          # both are acceptable, as in example_cnfs.yml. Only an errored test
          # (exit 2) fails the job. The coredns sample CNF is expected to fail
          # some compliance tests.
          if [ "$workload_status" -gt 1 ]; then
            echo "::error::workload errored (exit $workload_status) in offline mode"
            failed=1
          fi
          if ! grep -q '^Final workload score: ' airgap-workload.log; then
            echo "::error::workload did not reach its verdict in offline mode"
            failed=1
          fi
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
      - name: Upload the suite log and results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: airgap
          path: |
            airgap-cert.log
            airgap-workload.log
            cnti/results/
          if-no-files-found: warn
      - name: Remove the network block and the kind cluster
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        run: |
          SUITE_GID=$(getent group airgap-suite | cut -d: -f3 || true)
          if [ -n "$SUITE_GID" ]; then
            for tables in iptables ip6tables; do
              command -v "$tables" >/dev/null 2>&1 || continue
              sudo "$tables" -D OUTPUT -m owner --gid-owner "$SUITE_GID" -o lo -j ACCEPT || true
              sudo "$tables" -D OUTPUT -m owner --gid-owner "$SUITE_GID" \
                -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT || true
              sudo "$tables" -D OUTPUT -m owner --gid-owner "$SUITE_GID" -j REJECT || true
            done
          fi
          IPV4_KIND_SUBNETS=()
          for subnet in ${KIND_SUBNETS:-}; do
            case "$subnet" in
              *:*)
                tables=ip6tables
                ;;
              *)
                tables=iptables
                IPV4_KIND_SUBNETS+=("$subnet")
                ;;
            esac
            sudo "$tables" -D DOCKER-USER -s "$subnet" \
              -m conntrack --ctstate NEW -j REJECT || true
          done
          if [ "${#IPV4_KIND_SUBNETS[@]}" -gt 0 ]; then
            sudo iptables -D DOCKER-USER -s 10.244.0.0/16 \
              -m conntrack --ctstate NEW -j REJECT || true
          fi
          for destination in 10.96.0.0/16 10.244.0.0/16; do
            sudo iptables -D DOCKER-USER -d "$destination" -j ACCEPT || true
          done
          for subnet in ${KIND_SUBNETS:-}; do
            case "$subnet" in
              *:*) sudo ip6tables -D DOCKER-USER -d "$subnet" -j ACCEPT || true ;;
              *) sudo iptables -D DOCKER-USER -d "$subnet" -j ACCEPT || true ;;
            esac
          done
          if command -v kind >/dev/null 2>&1 && \
             kind get clusters 2>/dev/null | grep -qx "$KIND_CLUSTER_NAME"; then
            until kind delete cluster --name "$KIND_CLUSTER_NAME" --verbosity 1; do sleep 1; done
          else
            echo "kind cluster $KIND_CLUSTER_NAME is not present; nothing to delete"
          fi
