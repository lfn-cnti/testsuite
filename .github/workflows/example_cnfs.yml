name: Example CNFs validation
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: example-cnfs-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: ${{ matrix.suite }}-${{ matrix.cnf.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [cert, workload]
        cnf:
          - name: coredns
            config: example-cnfs/coredns/cnti-testsuite.yaml
          - name: envoy
            config: example-cnfs/envoy/cnti-testsuite.yaml
    env:
      KIND_CLUSTER_NAME: ${{ matrix.suite }}-${{ matrix.cnf.name }}-${{ github.run_id }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Cache the suite tools
        uses: ./.github/actions/cache-suite-tools
      - name: Login to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_PASSWORD != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_PASSWORD }}
      - name: Install kind
        uses: ./.github/actions/install-kind
      - name: Setup Kind Cluster
        run: |
          cat <<EOF > kind_setup.yaml
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          containerdConfigPatches:
          - |-
            root = "/tmp/containerd"
          nodes:
          - role: control-plane
            kubeadmConfigPatches:
            - |
              kind: ClusterConfiguration
              etcd:
                local:
                  dataDir: /tmp/etcd
            extraMounts:
            - containerPath: /var/lib/kubelet/config.json
              hostPath: $HOME/.docker/config.json
          - role: worker
            extraMounts:
            - containerPath: /var/lib/kubelet/config.json
              hostPath: $HOME/.docker/config.json
          - role: worker
            extraMounts:
            - containerPath: /var/lib/kubelet/config.json
              hostPath: $HOME/.docker/config.json
          EOF
          kind create cluster --name "$KIND_CLUSTER_NAME" --config kind_setup.yaml --wait 5m
      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
      - name: Build CNTi Test Suite
        run: |
          shards install
          crystal build src/cnti-testsuite.cr
      - name: Run ${{ matrix.suite }} suite on ${{ matrix.cnf.name }}
        run: |
          ./cnti-testsuite setup
          ./cnti-testsuite cnf_install --cnf-config ./${{ matrix.cnf.config }}
          # `cert` exits 0 when at least the certification threshold passes:
          # a higher exit means the CNF is not certified. `workload` exits 0
          # when every test passed and 1 when some failed; both are acceptable
          # here since the workflow reports the score, not a verdict. The CNF
          # and the suite are uninstalled first, so the failure is only
          # reported at the end of the step.
          MAX_EXIT=$([ "${{ matrix.suite }}" = "cert" ] && echo 0 || echo 1)
          set +e
          ./cnti-testsuite ${{ matrix.suite }} 2>&1 | tee suite.log
          SUITE_EXIT=${PIPESTATUS[0]}
          set -e
          echo "${{ matrix.suite }} exit code: $SUITE_EXIT"
          if [ "$SUITE_EXIT" -gt "$MAX_EXIT" ]; then
            echo "::error::${{ matrix.suite }} exited $SUITE_EXIT (max $MAX_EXIT) for ${{ matrix.cnf.name }}"
            FAILED=1
          fi
          ./cnti-testsuite cnf_uninstall
          ./cnti-testsuite uninstall_all
          if [ -n "$FAILED" ]; then
            echo "::error::${{ matrix.suite }} checks failed for ${{ matrix.cnf.name }}"
            exit 1
          fi
      - name: Delete Kind Cluster
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        run: |
          until kind delete cluster --name "$KIND_CLUSTER_NAME" --verbosity 1; do sleep 1; done
