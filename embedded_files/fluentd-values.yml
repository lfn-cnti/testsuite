# The fluentd chart has no image.digest value; FluentManager fingerprints the
# running collector by the digest this tag resolves to on Docker Hub.
# renovate: datasource=docker depName=fluent/fluentd-kubernetes-daemonset
image:
  repository: fluent/fluentd-kubernetes-daemonset
  tag: v1.19.3-debian-elasticsearch8-1.1

fileConfigs:
  04_outputs.conf: |-
    <label @OUTPUT>
      <match **>
        @type file
        path "/testdata"
      </match>
    </label>
