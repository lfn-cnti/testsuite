# A fluentd that is detected as a log collector (same image as the
# testsuite-installed one) but tails /tmp instead of the container logs,
# so no CNF log ever reaches it. The test recognises the collector by the
# digest of the image the suite pins, so this tag has to move with
# embedded_files/fluentd-values.yml and fluent_manager.cr: renovate bumps
# all three together through the marker below.
# renovate: datasource=docker depName=fluent/fluentd-kubernetes-daemonset
image:
  repository: fluent/fluentd-kubernetes-daemonset
  tag: v1.19.4-debian-elasticsearch8-1.1

fileConfigs:
  01_sources.conf: |-
    <source>
      @type tail
      @id in_tail_tmp
      @label @KUBERNETES
      path /tmp/*.log
      pos_file /var/log/fluentd-tmp.log.pos
      tag kubernetes.*
      read_from_head true
      <parse>
        @type none
      </parse>
    </source>
    # the chart's liveness/readiness probes hit this endpoint
    <source>
      @type prometheus
      bind 0.0.0.0
      port 24231
      metrics_path /metrics
    </source>
  04_outputs.conf: |-
    <label @OUTPUT>
      <match **>
        @type file
        path "/testdata"
      </match>
    </label>
