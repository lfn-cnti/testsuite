config_version: v2
common:
  auth_defaults:
    oci_registries:
      # port is docker-assigned and exported by spec/setup_spec.cr
      localhost:{{ ENV.SPEC_OCI_REGISTRY_PORT }}:
        username: "dummy"
        password: "secret"
deployments:
  helm_charts:
    - name: nginx-oci
      namespace: cnf-default
      registry_url: "oci://localhost:{{ ENV.SPEC_OCI_REGISTRY_PORT }}/helm/nginx"
      chart_version: "15.10.0"
      plain_http: true
      helm_values: --set global.security.allowInsecureImages=true --set image.repository=bitnamilegacy/nginx
