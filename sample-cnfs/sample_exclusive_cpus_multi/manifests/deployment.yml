---
# The latency-sensitive workload: Guaranteed pod, pinned container "upf" requests
# a whole CPU. This one is checked and must pass.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flagged-upf
  labels:
    app: flagged-upf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flagged-upf
  template:
    metadata:
      labels:
        app: flagged-upf
    spec:
      containers:
      - name: upf
        image: busybox:1.36
        command: ["sh", "-c", "sleep 2147483647"]
        resources:
          requests:
            cpu: "1"
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
---
# A second workload in the same CNF that is NOT latency-sensitive: it sets no
# resources (BestEffort) and must be ignored by the test.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unflagged-web
  labels:
    app: unflagged-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unflagged-web
  template:
    metadata:
      labels:
        app: unflagged-web
    spec:
      containers:
      - name: web
        image: busybox:1.36
        command: ["sh", "-c", "sleep 2147483647"]
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
