---
config_version: v2
deployments:
  manifests:
  - name: exclusive-cpus-multi
    manifest_directory: manifests
    # Only the latency-sensitive workload is named. The other workload in the
    # same deployment is not checked, so a multi-workload CNF (e.g. free5GC,
    # where only the UPF is latency-sensitive) passes.
    latency_sensitive:
      - kind: Deployment
        name: flagged-upf
        containers: [upf]
