---
apiVersion: v1
kind: Namespace
metadata:
  name: good-zombie
  labels:
    pod-security.kubernetes.io/enforce: privileged

---
# The nginx master process is PID 1 and reaps every child it inherits, so
# the zombie the zombie_handled test injects disappears.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: good-zombie
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        # renovate: datasource=docker depName=nginx
        image: nginx:1.31.6@sha256:60f0d4e986561e08804f75c211dcaf7fc5455699eada29f42cbe8a0a7253dd86
        ports:
        - containerPort: 80
        readinessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 2
          periodSeconds: 3
