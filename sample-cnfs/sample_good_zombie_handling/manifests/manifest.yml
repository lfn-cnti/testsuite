---
apiVersion: v1
kind: Namespace
metadata:
  name: good-zombie
  labels:
    pod-security.kubernetes.io/enforce: privileged

---
# The nginx master process is PID 1 and reaps every child it inherits, so
# the zombie the zombie_handled test injects disappears.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: good-zombie
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        # renovate: datasource=docker depName=nginx
        image: nginx:1.30.4@sha256:d5792f71a9496b833bc08ea834a758c46e2b6a6306c10f4be926f38a656cdc1c
        ports:
        - containerPort: 80
        readinessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 2
          periodSeconds: 3
