---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: single-stack-app
  labels:
    app: single-stack-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: single-stack-app
  template:
    metadata:
      labels:
        app: single-stack-app
    spec:
      containers:
      - name: app
        image: busybox:1.36
        command: ["sh", "-c", "sleep 2147483647"]
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: single-stack-app
spec:
  # No ipFamilyPolicy -> on a dual-stack cluster the Service receives only the
  # cluster's primary family. The dual_stack test should fail.
  selector:
    app: single-stack-app
  ports:
  - port: 80
    targetPort: 80
