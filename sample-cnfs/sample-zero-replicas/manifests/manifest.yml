# A CNF with one Deployment scaled to zero next to a running one. A workload
# scaled to zero has status.replicas 0 and no status.readyReplicas; cnf_install
# must count it as ready (0 of 0) instead of waiting for it until it times out
# (#2702).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zero-replicas-running
  labels:
    app: zero-replicas-running
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zero-replicas-running
  template:
    metadata:
      labels:
        app: zero-replicas-running
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: app
        image: busybox:1.36
        command: ["sh", "-c", "sleep 2147483647"]
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 50m
            memory: 32Mi
        securityContext:
          runAsUser: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zero-replicas-scaled-down
  labels:
    app: zero-replicas-scaled-down
spec:
  replicas: 0
  selector:
    matchLabels:
      app: zero-replicas-scaled-down
  template:
    metadata:
      labels:
        app: zero-replicas-scaled-down
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: app
        image: busybox:1.36
        command: ["sh", "-c", "sleep 2147483647"]
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 50m
            memory: 32Mi
        securityContext:
          runAsUser: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
