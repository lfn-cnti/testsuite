config_version: v2
common:
  auth_defaults:
    helm_repos:
      cm:
        username: "dummy"
        password: "secret"
deployments:
  helm_charts:
    - name: nginx-private
      namespace: cnf-default
      helm_repo_name: cm
      # port is docker-assigned and exported by spec/setup_spec.cr
      helm_repo_url: "http://localhost:{{ ENV.SPEC_CHART_MUSEUM_PORT }}"
      helm_chart_name: "nginx"
      chart_version: "15.10.0"
      skip_tls_verify: true
      pass_credentials: true
      helm_values: --set global.security.allowInsecureImages=true --set image.repository=bitnamilegacy/nginx
