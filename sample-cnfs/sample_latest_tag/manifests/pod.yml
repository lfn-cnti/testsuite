---
apiVersion: v1
kind: Namespace
metadata:
  name: nginx-stuff
  labels:
    pod-security.kubernetes.io/enforce: privileged

---
apiVersion: v1
kind: Pod
metadata:
  name: nginx
  namespace: nginx-stuff
spec:
  containers:
  - image: nginxinc/nginx-unprivileged:latest
    name: nginx
    livenessProbe:
      tcpSocket:
        port: 8080
    readinessProbe:
      tcpSocket:
        port: 8080
    resources: {}
    ports:
      - containerPort: 8080
      - containerPort: 8443
    securityContext:
      seLinuxOptions:
        type: spc_t
  dnsPolicy: Default
