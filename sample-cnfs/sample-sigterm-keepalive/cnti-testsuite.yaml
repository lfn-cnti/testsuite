---
# A container kept alive by a shell and a sleep, as the NATS chart's nats-box
# runs: the shell traps SIGTERM and exits, the kernel then ends the sleep.
# The sleep only keeps the container alive, so PID 1 is judged and the
# container passes (#2821).
config_version: v2
deployments:
  manifests:
  - name: keepalive
    manifest_directory: manifests
