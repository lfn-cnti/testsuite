---
# Two replicas, required to spread over nodes, and two budgets that each let a
# drain evict one at a time. Together they block every eviction: the eviction
# API refuses a pod that more than one budget selects.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: disruption-budget-overlap
  labels:
    app: disruption-budget-overlap
spec:
  replicas: 2
  selector:
    matchLabels:
      app: disruption-budget-overlap
  template:
    metadata:
      labels:
        app: disruption-budget-overlap
        tier: cnf
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app: disruption-budget-overlap
      containers:
      - name: app
        image: busybox:1.36
        command: ["sh", "-c", "sleep 2147483647"]
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: disruption-budget-overlap
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: disruption-budget-overlap
---
# A second budget over the same pods, as a tier-wide budget would be.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: disruption-budget-overlap-tier
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      tier: cnf
