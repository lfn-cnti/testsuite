---
apiVersion: v1
kind: Namespace
metadata:
  name: tracing
  labels:
    pod-security.kubernetes.io/enforce: privileged

---
# Jaeger's HotROD demo, pointed at the suite-installed Jaeger collector over
# OTLP (HotROD exports with the OpenTelemetry SDK since Jaeger 1.53, and
# ignores the old JAEGER_AGENT_* variables). It emits spans whenever it serves
# a request; the tracing spec sends one.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotrod
  namespace: tracing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hotrod
  template:
    metadata:
      labels:
        app: hotrod
    spec:
      containers:
      - name: hotrod
        # renovate: datasource=docker depName=jaegertracing/example-hotrod
        image: jaegertracing/example-hotrod:1.76.0@sha256:a96cc9e45b48a9bf11932fdfe24d5dc5660a89c9daeb854ef6a40c18f4a203b6
        env:
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://jaeger-collector.jaeger:4318
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /
            port: http

---
apiVersion: v1
kind: Service
metadata:
  name: hotrod
  namespace: tracing
spec:
  selector:
    app: hotrod
  ports:
  - name: http
    port: 80
    targetPort: http
