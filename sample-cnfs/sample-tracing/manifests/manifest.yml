---
apiVersion: v1
kind: Namespace
metadata:
  name: tracing
  labels:
    pod-security.kubernetes.io/enforce: privileged

---
# Jaeger's HotROD demo, pointed at the suite-installed Jaeger agent. It emits
# spans whenever it serves a request; the tracing spec sends one.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotrod
  namespace: tracing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hotrod
  template:
    metadata:
      labels:
        app: hotrod
    spec:
      containers:
      - name: hotrod
        # renovate: datasource=docker depName=jaegertracing/example-hotrod
        image: jaegertracing/example-hotrod:1.28.0@sha256:fbcdec6e28d20c578a4cf6f67365c6fa1392a1c9af44d4eab634696d0467dbdb
        env:
        - name: JAEGER_AGENT_HOST
          value: jaeger-agent.jaeger
        - name: JAEGER_AGENT_PORT
          value: "6831"
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /
            port: http

---
apiVersion: v1
kind: Service
metadata:
  name: hotrod
  namespace: tracing
spec:
  selector:
    app: hotrod
  ports:
  - name: http
    port: 80
    targetPort: http
