---
apiVersion: v1
kind: Namespace
metadata:
  name: unversioned
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
# One container with a versioned tag, one untagged: versioned_tag must
# name the untagged one and pass the other.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unversioned
  namespace: unversioned
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unversioned
  template:
    metadata:
      labels:
        app: unversioned
    spec:
      containers:
      - name: versioned
        image: nginxinc/nginx-unprivileged:1.29
        ports:
        - containerPort: 8080
      - name: untagged
        image: nginxinc/nginx-unprivileged
        # a second nginx in the same pod needs a port of its own
        command: ["sh", "-c", "sed -i 's/8080/8081/' /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'"]
        ports:
        - containerPort: 8081
