---
# The pod template sets no serviceAccountName, so its pods run as the
# namespace's default service account.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unset-sa-app
  labels:
    app: unset-sa-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unset-sa-app
  template:
    metadata:
      labels:
        app: unset-sa-app
    spec:
      containers:
      - name: app
        image: busybox:1.36
        command: ["sh", "-c", "sleep 2147483647"]
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
