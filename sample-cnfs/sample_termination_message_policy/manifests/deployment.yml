---
# Every container, the init container included, reports its failure reason
# from its log. Restricted-profile busybox so the pod is admitted on CI.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: termination-message-app
  labels:
    app: termination-message-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: termination-message-app
  template:
    metadata:
      labels:
        app: termination-message-app
    spec:
      initContainers:
      - name: init
        image: busybox:1.36
        command: ["sh", "-c", "true"]
        terminationMessagePolicy: FallbackToLogsOnError
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
      containers:
      - name: app
        image: busybox:1.36
        command: ["sh", "-c", "sleep 2147483647"]
        terminationMessagePolicy: FallbackToLogsOnError
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
