---
apiVersion: v1
kind: Namespace
metadata:
  name: cnfspace
  labels:
    pod-security.kubernetes.io/enforce: privileged

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: build-robot
  namespace: cnfspace
automountServiceAccountToken: true

---
apiVersion: v1
kind: Pod
metadata:
  name: nginx
  namespace: cnfspace
spec:
  serviceAccount: build-robot
  serviceAccountName: build-robot
  containers:
  - image: nginxinc/nginx-unprivileged:1.29
    name: nginx
    livenessProbe:
      tcpSocket:
        port: 8080
    readinessProbe:
      tcpSocket:
        port: 8080
    resources: {}
    ports:
      - containerPort: 8080
      - containerPort: 8443
  dnsPolicy: Default
