---
# CoreDNS with a 1 MB image size limit: reasonable_image_size must report the
# measured size against that limit and fail.
config_version: v2
common:
  image_size_max_mb: 1
deployments:
  helm_charts:
  - name: coredns
    helm_chart_name: coredns
    helm_repo_name: stable
    helm_repo_url: https://cncf.gitlab.io/stable
