---
# A valid config naming a chart the repository does not have: the pull fails
# before anything reaches the cluster (#2674). The repository is CoreDNS's
# real one, under a name of its own so the spec can remove it afterwards.
config_version: v2
deployments:
  helm_charts:
  - name: coredns
    helm_chart_name: corsdsdsdedns
    helm_repo_name: badchartrepo
    helm_repo_url: https://coredns.github.io/helm
