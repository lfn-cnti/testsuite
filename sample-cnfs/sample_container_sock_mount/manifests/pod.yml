---
apiVersion: v1
kind: Namespace
metadata:
  name: cnfspace
  labels:
    pod-security.kubernetes.io/enforce: privileged

---
apiVersion: v1
kind: Pod
metadata:
  name: nginx
  namespace: cnfspace
spec:
  containers:
  - image: nginxinc/nginx-unprivileged:1.29
    name: nginx
    livenessProbe:
      tcpSocket:
        port: 8080
    readinessProbe:
      tcpSocket:
        port: 8080
    resources: {}
    ports:
      - containerPort: 8080
      - containerPort: 8443
  volumes:
    - name: docker-engine-socket
      hostPath:
        path: "/var/run/docker.sock"
    - name: containerd-engine-socket
      hostPath:
        path: "/var/run/containerd.sock"
  dnsPolicy: Default
