---
# The container does not set terminationMessagePolicy, so the API server
# defaults it to File.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: termination-message-unset
  labels:
    app: termination-message-unset
spec:
  replicas: 1
  selector:
    matchLabels:
      app: termination-message-unset
  template:
    metadata:
      labels:
        app: termination-message-unset
    spec:
      containers:
      - name: app
        image: busybox:1.36
        command: ["sh", "-c", "sleep 2147483647"]
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
