---
apiVersion: v1
kind: Namespace
metadata:
  name: crashloop
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crash-looper
  namespace: crashloop
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: crash-looper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crash-looper
    spec:
      containers:
      - name: app
        image: busybox:1.36
        command: ["sh", "-c", "echo cnti-crash-marker: configuration missing; exit 1"]
        # Without a probe the kubelet counts the container Ready for the
        # moment it runs between restarts, and the install can see the
        # Deployment available. This one never succeeds, so it never is.
        readinessProbe:
          exec:
            command: ["false"]
          periodSeconds: 1
