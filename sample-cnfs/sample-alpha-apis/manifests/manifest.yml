---
apiVersion: v1
kind: Namespace
metadata:
  name: alpha-apis
  labels:
    pod-security.kubernetes.io/enforce: privileged

---
# A CRD whose only served version is alpha: the alpha_k8s_apis test must flag it.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.example.com
spec:
  group: example.com
  scope: Namespaced
  names:
    plural: widgets
    singular: widget
    kind: Widget
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        x-kubernetes-preserve-unknown-fields: true

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alpha-apis
  namespace: alpha-apis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alpha-apis
  template:
    metadata:
      labels:
        app: alpha-apis
    spec:
      containers:
      - name: main
        # renovate: datasource=docker depName=busybox
        image: busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
        command: ["sh", "-c", "sleep 2147483647"]
