---
config_version: v2
deployments:
  manifests:
  - name: exclusive-cpus-present
    manifest_directory: manifests
    # Names a workload that the CNF does not deploy; the test cannot measure it
    # and should report skipped, not failed.
    latency_sensitive:
      - kind: Deployment
        name: does-not-exist
        containers: [app]
