---
# Every rollout tag points at a tag that does not exist, so each rollout
# test fails on a rollout that never completes, not on a missing tag.
config_version: v2
common:
  container_names:
  - name: coredns
    rolling_update_test_tag: this_is_not_a_valid_version
    rolling_downgrade_test_tag: this_is_not_a_valid_version
    rolling_version_change_test_tag: this_is_not_a_valid_version
    rollback_from_tag: this_is_not_a_valid_version
deployments:
  helm_dirs:
  - name: coredns
    helm_directory: chart
