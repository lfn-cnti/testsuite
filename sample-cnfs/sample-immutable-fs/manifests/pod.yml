---
apiVersion: v1
kind: Namespace
metadata:
  name: cnfspace
  labels:
    pod-security.kubernetes.io/enforce: privileged

---
apiVersion: v1
kind: Pod
metadata:
  name: nginx
  namespace: cnfspace
spec:
  volumes:
  - name: root-tmp
    emptyDir: {}
  - name: nginx-cache
    emptyDir: {}

  containers:
  - image: nginxinc/nginx-unprivileged:1.29
    name: nginx
    securityContext:
      readOnlyRootFilesystem: true
    livenessProbe:
      tcpSocket:
        port: 8080
    readinessProbe:
      tcpSocket:
        port: 8080
    resources: {}
    ports:
      - containerPort: 8080
      - containerPort: 8443
    volumeMounts:
    - name: root-tmp
      mountPath: /tmp
    - name: nginx-cache
      mountPath: /var/cache/nginx
  dnsPolicy: Default
