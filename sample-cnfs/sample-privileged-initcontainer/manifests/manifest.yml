# A Deployment whose only privileged container is an initContainer. Used to
# verify privileged_containers inspects init containers (#2486).
apiVersion: v1
kind: Namespace
metadata:
  name: privileged-init
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: privileged-init
  namespace: privileged-init
  labels:
    app: privileged-init
spec:
  replicas: 1
  selector:
    matchLabels:
      app: privileged-init
  template:
    metadata:
      labels:
        app: privileged-init
    spec:
      initContainers:
      - name: privileged-setup
        image: busybox:1.33.1
        command: ["/bin/true"]
        securityContext:
          privileged: true
      containers:
      - name: app
        image: busybox:1.33.1
        command: ["/bin/sleep", "2147483647"]
