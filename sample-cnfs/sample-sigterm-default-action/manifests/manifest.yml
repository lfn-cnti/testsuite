---
apiVersion: v1
kind: Namespace
metadata:
  name: default-action
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: default-action
  namespace: default-action
  labels:
    app: default-action
spec:
  replicas: 1
  selector:
    matchLabels:
      app: default-action
  template:
    metadata:
      labels:
        app: default-action
    spec:
      containers:
      - name: supervisor
        image: busybox:1.37.0
        command:
        - sh
        - -c
        - |
          sh -c 'while :; do sleep 1; done' &
          child=$!
          trap 'kill -TERM $child; wait $child; exit 0' TERM
          wait $child
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
