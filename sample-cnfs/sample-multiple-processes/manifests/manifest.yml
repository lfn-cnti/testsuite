---
apiVersion: v1
kind: Namespace
metadata:
  name: mp-test
  labels:
    pod-security.kubernetes.io/enforce: privileged

---
# One container, two application process types under a shell PID 1: busybox
# httpd serving /tmp, and sleep. The single_process_type test must fail it.
apiVersion: v1
kind: Pod
metadata:
  name: multiple-processes
  namespace: mp-test
spec:
  containers:
  - name: multiple-processes
    # renovate: datasource=docker depName=busybox
    image: busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
    # The loop keeps the shell as PID 1 (busybox sh would exec a trailing command).
    command: ["sh", "-c", "httpd -f -p 8080 -h /tmp & while true; do sleep 3600; done"]
    livenessProbe:
      tcpSocket:
        port: 8080
      initialDelaySeconds: 3
      periodSeconds: 3
    readinessProbe:
      tcpSocket:
        port: 8080
      initialDelaySeconds: 3
      periodSeconds: 3
