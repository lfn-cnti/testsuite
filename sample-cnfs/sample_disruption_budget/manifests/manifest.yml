---
# Two replicas, required to spread over nodes, and a budget that lets a drain
# evict one at a time.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: disruption-budget-app
  labels:
    app: disruption-budget-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: disruption-budget-app
  template:
    metadata:
      labels:
        app: disruption-budget-app
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app: disruption-budget-app
      containers:
      - name: app
        image: busybox:1.36
        command: ["sh", "-c", "sleep 2147483647"]
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: disruption-budget-app
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: disruption-budget-app
