---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: no-service-app
  labels:
    app: no-service-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: no-service-app
  template:
    metadata:
      labels:
        app: no-service-app
    spec:
      containers:
      - name: app
        image: busybox:1.36
        command: ["sh", "-c", "sleep 2147483647"]
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
