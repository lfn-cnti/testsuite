---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dual-stack-app
  labels:
    app: dual-stack-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dual-stack-app
  template:
    metadata:
      labels:
        app: dual-stack-app
    spec:
      containers:
      - name: app
        image: busybox:1.36
        command: ["sh", "-c", "sleep 2147483647"]
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: dual-stack-app
spec:
  # Declares dual-stack; PreferDualStack also works cleanly on a
  # single-stack cluster (it falls back to one family).
  ipFamilyPolicy: PreferDualStack
  selector:
    app: dual-stack-app
  ports:
  - port: 80
    targetPort: 80
