---
apiVersion: v1
kind: Namespace
metadata:
  name: crd-descriptions
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: crd-descriptions
  namespace: crd-descriptions
data:
  # Not an address: the third number is not an octet.
  note: "example OID 1.2.840.113556.1.4.221"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crd-descriptions
  namespace: crd-descriptions
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crd-descriptions
  template:
    metadata:
      labels:
        app: crd-descriptions
    spec:
      containers:
      - name: sleeper
        image: busybox:1.36
        command: ["sh", "-c", "sleep 1h"]
