---
apiVersion: v1
kind: Namespace
metadata:
  name: pid1-hangs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pid1-hangs
  namespace: pid1-hangs
  labels:
    app: pid1-hangs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pid1-hangs
  template:
    metadata:
      labels:
        app: pid1-hangs
    spec:
      # The default grace period: longer than the wait for the judged
      # processes, so the runtime's kill comes well after the child stopped.
      terminationGracePeriodSeconds: 30
      containers:
      - name: box
        image: busybox:1.37.0
        command:
        - sh
        - -c
        - |
          sh -c 'trap "exit 0" TERM; while :; do sleep 1; done' &
          child=$!
          trap "kill $child; while :; do sleep 1; done" TERM
          wait
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
