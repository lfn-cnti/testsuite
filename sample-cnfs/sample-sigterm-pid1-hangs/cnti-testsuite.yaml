---
# A supervisor that forwards SIGTERM to its child and then hangs: the child
# stops, PID 1 does not, and the runtime kills the container when the grace
# period is over. The container fails on the kubelet's terms, although every
# judged child stopped.
config_version: v2
deployments:
  manifests:
  - name: pid1-hangs
    manifest_directory: manifests
