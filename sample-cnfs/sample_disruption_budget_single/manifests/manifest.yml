---
# One replica and no budget: availability is kept elsewhere, or not needed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: disruption-budget-single
  labels:
    app: disruption-budget-single
spec:
  replicas: 1
  selector:
    matchLabels:
      app: disruption-budget-single
  template:
    metadata:
      labels:
        app: disruption-budget-single
    spec:
      containers:
      - name: app
        image: busybox:1.36
        command: ["sh", "-c", "sleep 2147483647"]
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
