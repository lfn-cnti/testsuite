---
# The workload runs as a ServiceAccount of its own, created by the CNF.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dedicated-sa-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dedicated-sa-app
  labels:
    app: dedicated-sa-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dedicated-sa-app
  template:
    metadata:
      labels:
        app: dedicated-sa-app
    spec:
      serviceAccountName: dedicated-sa-app
      containers:
      - name: app
        image: busybox:1.36
        command: ["sh", "-c", "sleep 2147483647"]
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
