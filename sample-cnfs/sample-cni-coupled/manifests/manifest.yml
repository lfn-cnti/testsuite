---
apiVersion: v1
kind: Namespace
metadata:
  name: cni-coupled
  labels:
    pod-security.kubernetes.io/enforce: privileged

---
# The Multus networks annotation couples this workload to a meta-CNI; without
# Multus it is ignored, so the fixture installs on any cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cni-coupled
  namespace: cni-coupled
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cni-coupled
  template:
    metadata:
      labels:
        app: cni-coupled
      annotations:
        k8s.v1.cni.cncf.io/networks: macvlan-conf
    spec:
      containers:
      - name: main
        # renovate: datasource=docker depName=busybox
        image: busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
        command: ["sh", "-c", "sleep 2147483647"]
