---
apiVersion: v1
kind: Namespace
metadata:
  # Its own namespace, so the spec can remove it whole and nothing lands in
  # default. hostNetwork needs the privileged level.
  name: cnti-registry
  labels:
    pod-security.kubernetes.io/enforce: privileged

---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: cnti-registry
spec:
  selector:
    app: registry
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000

---
apiVersion: v1
kind: Pod
metadata:
  name: registry
  namespace: cnti-registry
  labels:
    app: registry
spec:
  hostNetwork: true
  containers:
  - name: registry
    image: registry:latest
    ports:
      - containerPort: 5000
    livenessProbe:
      tcpSocket:
        port: 5000
      initialDelaySeconds: 3
      periodSeconds: 3
    readinessProbe:
      tcpSocket:
        port: 5000
      initialDelaySeconds: 3
      periodSeconds: 3
