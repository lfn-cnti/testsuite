# Deployed by the destructive worker_reboot_recovery platform test: the pod
# waits until the test touches /tmp/reboot, then reboots its node via sysrq.
apiVersion: apps/v1
kind: DaemonSet
metadata:
    name: reboot
spec:
  selector:
    matchLabels:
      name: reboot
  template:
    metadata:
      labels:
        name: reboot
    spec:
      containers:
        - name: reboot
          # renovate: datasource=docker depName=busybox
          image: busybox:1.33.1@sha256:f7ca5a32c10d51aeda3b4d01c61c6061f497893d7f6628b92f822f7117182a57
          command: ["sh", "-c", "until [ -f /tmp/reboot ]; do sleep 1; done; echo b > /sysrq"]
          volumeMounts:
          - mountPath: /sysrq
            name: sysrq-volume
      volumes:
      -  name: sysrq-volume
         hostPath:
           path: /proc/sysrq-trigger
